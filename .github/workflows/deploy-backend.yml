name: Backend Continuous Integration & Deployment
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Verificar que la aplicación importa correctamente
        run: python -c "import main"

  deploy-remote:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted   # el runner solo dispara el deploy, no construye nada aquí
    steps:
      - name: Checkout en el Runner
        uses: actions/checkout@v4

      - name: Cargar clave SSH (sin Docker, corre nativo en el runner)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Confiar en el host remoto
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sincronizar código con el servidor
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p ~/backend-deploy"
          scp -P "$SERVER_PORT" main.py requirements.txt deploy.sh "$SERVER_USER@$SERVER_HOST:~/backend-deploy/"

      - name: Desplegar en el servidor remoto con deploy.sh
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            cd ~/backend-deploy
            chmod +x deploy.sh
            ./deploy.sh
            echo "[INFO] Validando disponibilidad del servicio..."
            sleep 3
            curl -f http://localhost:8080/health
          '
