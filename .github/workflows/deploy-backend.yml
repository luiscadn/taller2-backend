name: Backend Continuous Integration & Deployment
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Verificar que la aplicación importa correctamente
        run: python -c "import main"

  deploy-remote:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted   # el runner solo dispara el deploy, no construye nada aquí
    steps:
      - name: Checkout en el Runner
        uses: actions/checkout@v4

      - name: Sincronizar código con el servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "."
          target: "~/backend-deploy"

      - name: Desplegar en el servidor remoto con deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/backend-deploy
            chmod +x deploy.sh
            ./deploy.sh
            echo "[INFO] Validando disponibilidad del servicio..."
            sleep 3
            curl -f http://localhost:8080/health || exit 1
